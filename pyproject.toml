[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot-step-s2s"
version = "0.1.0"
description = "PetBot step policy ONNX/MuJoCo preview"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "mujoco==3.8.1", "onnxruntime>=1.20,<2"]

[tool.setuptools.packages.find]
include = ["step_s2s*"]
